<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くだものおとし｜ゲーム広告</title>
<link rel="stylesheet" href="../shared/game.css">
</head>
<body data-state="ready">
<div id="stage">
  <canvas id="game" width="720" height="720"></canvas>

  <div id="start" hidden>
    <div class="card">
      <h1>くだものおとし</h1>
      <p>タップした場所にくだものが落ちる。<br>同じもの同士がくっつくと、ひとつ大きくなる。<br>線を越えたら終わり。</p>
      <div class="btns"><button id="btnPlay">はじめる</button></div>
    </div>
  </div>

  <div id="after" hidden>
    <button id="btnReplay">もう一回</button>
    <a id="btnCta" href="https://yamanryosuke.github.io/game-ad-delivery/sample-lp/?c=suika"
       target="_blank" rel="noopener noreferrer">詳しくはこちら</a>
  </div>
</div>

<script src="../shared/ad-sdk.js"></script>
<script src="../shared/sfx.js"></script>
<script src="./game.js"></script>
<script src="../shared/embed-button.js"></script>
</body>
</html>
