<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とびこえランナー｜ゲーム広告</title>
<link rel="stylesheet" href="../shared/game.css">
</head>
<body data-state="ready">
<div id="stage">
  <canvas id="game" width="720" height="720"></canvas>

  <div id="start" hidden>
    <div class="card">
      <h1>とびこえランナー</h1>
      <p>タップでジャンプ。障害物をよけて走り続ける。<br>（キーボードは Space / Enter）</p>
      <div class="btns"><button id="btnPlay">はじめる</button></div>
    </div>
  </div>

  <div id="after" hidden>
    <button id="btnReplay">もう一回</button>
    <a id="btnCta" href="https://example.com/lp/runner"
       target="_blank" rel="noopener noreferrer">詳しくはこちら</a>
  </div>
</div>

<script src="../shared/ad-sdk.js"></script>
<script src="../shared/sfx.js"></script>
<script src="./game.js"></script>
<script src="../shared/embed-button.js"></script>
</body>
</html>
