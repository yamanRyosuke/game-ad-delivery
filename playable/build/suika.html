<head>
<!--
  プレイアブル広告版（単体 HTML）: くだものおとし

  直すのは suika/ と shared/ と playable/ の側。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くだものおとし｜ゲーム広告</title>
<style>
/* ---- ../shared/game.css ---- */
/*
 * game.css — 広告ゲーム共通の枠まわり
 *
 * ゲームごとに違うのは canvas に描く中身だけ。外側は全部これで共通にする。
 * 表示比率は 1:1 で統一している。メディアに渡す iframe のコードが
 * ゲームごとに変わらないようにするため。
 */

html, body { margin: 0; padding: 0; background: #0d1017; overflow: hidden; }
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

#stage { position: relative; line-height: 0; }

canvas {
  display: block;
  /* 画面の短辺に合わせて正方形を保つ。iframe 側で aspect-ratio:1/1 を
     指定してもらう前提だが、指定が無くても破綻しないようにしている。 */
  width: min(720px, 100vw, 100vh);
  height: min(720px, 100vw, 100vh);
  /* pan-y = 縦スクロールはブラウザに任せ、タップだけをゲームが受け取る。
     none にすると canvas の上で記事をスクロールできず、
     スマホで「広告に指が吸い付いて記事が読めない」状態になる。 */
  touch-action: pan-y;
  background: #0d1017;
}

/* --- 開始画面 ------------------------------------------------------------ */
#start {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(13, 16, 23, 0.93);
  line-height: 1.6;
}
#start .card { width: min(88%, 520px); text-align: center; color: #f2f4f8; }
#start h1 { margin: 0 0 10px; font-size: clamp(20px, 5.4vw, 30px); font-weight: 800; }
#start p  { margin: 0 0 22px; font-size: clamp(12px, 3.2vw, 15px); color: #97a3b4; }
#start .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* --- 終了後のバー -------------------------------------------------------- */
/* canvas の「下」ではなく「上」に重ねる。iframe を正方形にすると canvas が
   枠いっぱいになり、下に置いた要素は見えなくなるため。 */
#after {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
  padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  line-height: 1.6;
  background: linear-gradient(to top, rgba(13, 16, 23, 0.96), rgba(13, 16, 23, 0));
}

#start[hidden], #after[hidden] { display: none; }

/* --- ボタン -------------------------------------------------------------- */
button, #btnCta {
  font: inherit; font-size: clamp(13px, 3.4vw, 16px); font-weight: 700;
  padding: 12px 20px; border: 1px solid #3d5a80; border-radius: 4px;
  background: #1b2436; color: #f2f4f8; cursor: pointer;
}
button:hover { background: #243049; }
#btnCta {
  display: inline-block; text-decoration: none; box-sizing: border-box;
  background: #f5b544; color: #1b2436; border-color: #f5b544;
}
#btnCta:hover { background: #f7c467; }

/* 右下の「埋め込みコード」ボタンは embed-button.js が自前で描画する。
   どのゲームの CSS でも同じ見た目になるよう、あちら側で完結させてある。 */
</style>
<style>
/* ---- playable/shell.css ---- */
/*
 * shell.css — プレイアブル広告版だけに足す外枠
 *
 * 記事に貼る iframe 配信版は正方形（1:1）で統一しているが、
 * プレイアブル広告は Meta が「縦向き（portrait）かつレスポンシブ」を必須にしている。
 * canvas は 720x720 のままなので、縦長の画面では上下に余白が出る。
 * その余白を使って CTA を大きく置くのが以下の指定。
 *
 * 注意: #start と #after は #stage の中に絶対配置されている（shared/game.css）。
 * ここで position を通常フローに戻すと、#stage を flex にした瞬間に
 * canvas の「横」へ回り込む。絶対配置のまま扱うこと。
 */
:root {
  /* CTA バーの高さ。canvas の下に必ずこの分の余白を確保する。
     終了前から場所を空けておくことで、CTA 出現時に画面が動かない。 */
  --cta-h: 96px;
}

html, body { height: 100%; }
body {
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
}

/* 正方形の canvas を、CTA バーの分を除いた領域の中央に置く */
#stage {
  position: relative;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 0;
  padding-bottom: var(--cta-h);
}
#game {
  width: min(100vw, calc(100vh - var(--cta-h)));
  height: min(100vw, calc(100vh - var(--cta-h)));
  max-width: 100%;
}

/* CTA バー。canvas の上に重ねるのではなく、下に確保した余白へ置く。
   縦長画面では canvas の外に出した方が押しやすく、誤タップも減る。 */
#after {
  height: var(--cta-h);
  box-sizing: border-box;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px));
  background: #0d1017;
  flex-wrap: nowrap;
}
#btnCta {
  flex: 1 1 auto;
  max-width: 320px;
  text-align: center;
  padding: 14px 20px;
  font-size: clamp(15px, 4.2vw, 18px);
}
#btnReplay { flex: 0 0 auto; }

/* 横向きで開かれたときも破綻させない。
   TikTok は config.json で縦固定にするが、Meta のプレビューや
   実機の回転までは保証されないため、横でも成立させておく。 */
@media (orientation: landscape) {
  #stage { padding-bottom: 0; }
  #game { width: min(720px, 100vw, 100vh); height: min(720px, 100vw, 100vh); }
  #after {
    height: auto;
    padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(13, 16, 23, .96), rgba(13, 16, 23, 0));
    flex-wrap: wrap;
  }
}
</style>
</head>
<body data-state="ready">
<div id="stage">

    <button id="btnCta" data-href="https://yamanryosuke.github.io/game-ad-delivery/sample-lp/?c=suika">詳しくはこちら</button>
  </div>
</div>
<script>
/* ---- playable/adapter.js ---- */
/*
 * adapter.js — プレイアブル広告版だけに入る、CTA の委譲先アダプタ
 *
 * プレイアブル広告は「広告ネットワークのコンテナの中で動く単体 HTML」なので、
 * ストアへ送る手段がネットワークごとに違う。ゲーム側にネットワーク判定を書くと
 * 配信先が増えるたびにゲームを触ることになるため、ここで吸収する。
 *
 *   Meta     window.FbPlayableAd.onCTAClick()
 *   TikTok   window.openAppStore()
 *   MRAID系  window.mraid.open(url)      … Unity / AppLovin / ironSource など
 *   なし     親へ postMessage するだけ    … 掲載イメージのページ / 単体で開いたとき
 *
 * 判定は「読み込み時」ではなく「クリック時」に行う。ネットワークの SDK は
 * コンテナ側があとから注入することがあり、起動時点ではまだ存在しないため。
 *
 * このファイルは iframe 配信版（各ゲームの index.html）には入らない。
 * 入るのは tools/build-playable.py が生成した単体 HTML だけ。
 */
(function () {
  'use strict';

  function detect() {
    if (window.FbPlayableAd && typeof window.FbPlayableAd.onCTAClick === 'function') return 'meta';
    if (typeof window.openAppStore === 'function') return 'tiktok';
    if (window.mraid && typeof window.mraid.open === 'function') return 'mraid';
    return 'none';
  }

  function notify(network, href, handled) {
    var payload = {
      source: 'game-ad',
      event: 'cta_dispatch',
      data: { network: network, href: href, handled: handled },
      ts: Date.now()
    };
    console.log('[playable] CTA →', network, handled ? '(ネットワークAPIへ委譲)' : '(委譲先なし)');
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
    } catch (e) { /* コンテナがクロスオリジンでも落とさない */ }
    document.dispatchEvent(new CustomEvent('gamead:cta_dispatch', { detail: payload }));
  }

  window.__adNetworkCta = function (href) {
    var network = detect();
    switch (network) {
      case 'meta':
        window.FbPlayableAd.onCTAClick();
        break;
      case 'tiktok':
        window.openAppStore();
        break;
      case 'mraid':
        window.mraid.open(href);
        break;
      default:
        // ここで location を書き換えたくなるが、やってはいけない。
        // TikTok は JS リダイレクトを明示的に禁止しており、審査で弾かれる。
        // 遷移させるかどうかは、埋め込んでいる側の責任にする。
        break;
    }
    notify(network, href, network !== 'none');
  };

  window.__adNetwork = detect;
})();
</script>
<script>
/* ---- ../shared/ad-sdk.js ---- */
/*
 * ad-sdk.js — 広告ゲーム共通の配信まわり
 *
 * どのゲームも「ゲームの中身」以外は同じことをする。その部分だけをここに集めた。
 *
 *   - 親ページ（Web メディア）への postMessage
 *   - CTA のクリック計測
 *
 * 右下の「埋め込みコード」ボタンは embed-button.js が別に受け持つ。
 *
 * ゲーム側は AdSDK.init() を1回呼び、あとは start() / complete() / interaction()
 * を適切なタイミングで呼ぶだけでよい。
 */
(() => {
  'use strict';

  // ===========================================================================
  // ★★★ 本番では targetOrigin を必ず配信先ドメインに限定すること ★★★
  //
  // '*' のままだと、このゲームを iframe で埋め込んだ「任意の」ページが
  // スコア・プレイ時間・行動ログを受け取れてしまう。
  //
  //   const PARENT_ORIGIN = 'https://media-example.jp';
  //
  // 複数メディアへ配信する場合は、配信時に生成する設定ファイル、または
  // iframe の URL パラメータでオリジンを受け取り、許可リストと突き合わせてから
  // 使う。URL パラメータをそのまま targetOrigin に渡してはいけない。
  //
  // 掲載テスト中は、どのメディアに貼られるか未確定のため '*' にしてある。
  // ===========================================================================
  const PARENT_ORIGIN = '*';
  const AD_SOURCE = 'game-ad';

  const embedded = window.parent !== window;

  let campaign = 'unknown';
  let sentFirstInteraction = false;
  let startedAt = 0;

  // ---- 親ページへ送る -------------------------------------------------------
  function emit(event, data) {
    const payload = {
      source: AD_SOURCE,
      campaign: campaign,
      event: event,
      data: data || {},
      ts: Date.now(),
    };
    console.log('[game-ad] emit:', event, payload.data);
    try {
      if (embedded) window.parent.postMessage(payload, PARENT_ORIGIN);
    } catch (e) {
      console.warn('[game-ad] postMessage に失敗:', e);
    }
    // 直接開いたときにも確認できるよう、同一ドキュメント内にも流す
    document.dispatchEvent(new CustomEvent('gamead:' + event, { detail: payload }));
  }

  // 「人間が最初にこのゲームに触った瞬間」。1回だけ送る。
  function interaction(kind) {
    if (sentFirstInteraction) return;
    sentFirstInteraction = true;
    emit('first_interaction', { kind: kind });
  }

  // ---- CTA ------------------------------------------------------------------
  // iframe の中からリンクを踏んでも親ページを遷移させないことが重要。
  // それを担保しているのは JS ではなく HTML 側の属性:
  //   target="_blank"           → 新しいタブで開く（親フレームを書き換えない）
  //   rel="noopener noreferrer" → 遷移先から window.opener 経由で操作されるのを防ぐ
  // ここでは遷移を止めず、計測だけ行う。
  function wireCta() {
    const cta = document.getElementById('btnCta');
    if (!cta) return;
    cta.addEventListener('click', (e) => {
      // プレイアブル広告版では <a href> ではなく <button data-href> に置き換わる
      const href = cta.getAttribute('href') || cta.dataset.href || '';
      emit('cta_click', {
        href: href,
        label: (cta.textContent || '').trim(),
        placement: 'after_game',
      });
      // [Playable] 広告ネットワークの中ではリンク遷移も JS リダイレクトも禁止されており、
      // ストアへ送るのはネットワークが提供する API の役目になる。
      // playable/adapter.js が読み込まれているときだけ、そちらへ委譲する。
      // iframe 配信版では __adNetworkCta が存在しないので、従来どおり <a> が働く。
      if (typeof window.__adNetworkCta === 'function') {
        e.preventDefault();
        window.__adNetworkCta(href);
      }
    });
  }

  // ---- 公開 API -------------------------------------------------------------
  window.AdSDK = {
    /** ゲーム読み込み直後に1回だけ呼ぶ。 */
    init(opts) {
      const o = opts || {};
      campaign = o.campaign || 'unknown';
      wireCta();
      emit('game_ready', {
        embedded: embedded,
        canvas: o.canvas || '720x720',
        ua: navigator.userAgent,
      });
    },

    /** ゲーム開始時に呼ぶ。 */
    start(data) {
      startedAt = performance.now();
      emit('game_start', data || {});
    },

    /** ゲーム終了時に呼ぶ。playTimeMs は自動で足す。 */
    complete(data) {
      const d = Object.assign({}, data || {});
      if (d.playTimeMs === undefined) {
        d.playTimeMs = startedAt ? Math.round(performance.now() - startedAt) : 0;
      }
      emit('game_complete', d);
    },

    interaction: interaction,
    emit: emit,
    embedded: embedded,
  };
})();
</script>
<script>
/* ---- ../shared/sfx.js ---- */
/*
 * sfx.js — Web Audio API の最小限のラッパー
 *
 * 効果音ファイルを持たず、その場で合成する。読み込むファイルが増えないので
 * 広告として軽い。
 *
 * ★ AudioContext を作るのは SFX.unlock() の中だけ。
 *   ゲーム側は必ず「ユーザーが開始ボタンを押した後」に呼ぶこと。
 *   ページを開いただけで音が鳴る作りにしてはいけない（Autoplay Policy）。
 */
(() => {
  'use strict';

  let ac = null, master = null, noiseBuf = null;

  function unlock() {
    if (ac) {
      if (ac.state === 'suspended' && ac.resume) ac.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.28;
      master.connect(ac.destination);
      if (ac.state === 'suspended' && ac.resume) ac.resume();
    } catch (e) {
      ac = null; master = null;
    }
  }

  function tone(freq, dur, type, gain, toFreq, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20, toFreq), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.03, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, f0, f1, gain, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 1.2), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'lowpass';
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }

  window.SFX = { unlock: unlock, tone: tone, noise: noise };
})();
</script>
<script>
/* ---- ./game.js ---- */
/*
 * くだものおとし — 同じくだもの同士をくっつけて大きくしていく
 *
 * 配信まわり（postMessage / CTA / 埋め込みコード）は ../shared/ad-sdk.js が持つ。
 *
 * 物理は「位置ベースの簡易ソルバ」。重力で動かしたあと、壁とくだもの同士の
 * めり込みを数回に分けて押し戻す。厳密ではないが、この遊びには十分で軽い。
 */
(() => {
  'use strict';

  const W = 720, H = 720;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ---- 箱の寸法 -----------------------------------------------------------
  const LEFT = 116, RIGHT = 604, FLOOR = 682;
  const DEAD_Y = 176;          // この線を越えたまま止まると終わり
  const SPAWN_Y = 96;

  // ---- 物理 ---------------------------------------------------------------
  const GRAVITY   = 2000;
  const SUBSTEPS  = 2;
  const ITER      = 4;
  const REST      = 0.12;      // 反発。小さいほど「ぬちゃっ」と積む
  const FRICTION  = 0.986;
  const DROP_WAIT = 0.42;      // 連打で降らせすぎないための間隔
  const OVER_HOLD = 1.15;      // 線を越えたまま何秒で終わりにするか

  // ---- くだもの -----------------------------------------------------------
  const R    = [17, 23, 30, 38, 47, 57, 68, 80, 94];
  const COL  = ['#e8544a', '#f2857a', '#a874dc', '#f0913c', '#f5c542',
                '#e2604f', '#eae2b7', '#8ec96a', '#4da84a'];
  const NAME = ['さくらんぼ', 'いちご', 'ぶどう', 'みかん', 'かき',
                'りんご', 'なし', 'もも', 'すいか'];
  const MAXLV = R.length - 1;
  const DROPPABLE = 5;         // 落ちてくるのは小さい5種類まで

  // ---- 状態 ---------------------------------------------------------------
  let mode = 'idle';           // idle | play | over
  let raf = 0, lastT = 0;
  let fruits, nextLv, curLv, aimX, dropCool, score, best = 0, overT, popped;
  let seq = 0;

  function reset() {
    fruits = [];
    curLv = (Math.random() * DROPPABLE) | 0;
    nextLv = (Math.random() * DROPPABLE) | 0;
    aimX = (LEFT + RIGHT) / 2;
    dropCool = 0; score = 0; overT = 0; popped = 0;
  }

  function addFruit(x, y, lv, vx, vy) {
    fruits.push({ x: x, y: y, vx: vx || 0, vy: vy || 0, lv: lv,
                  r: R[lv], age: 0, id: seq++ });
  }

  // ---- 入力 ---------------------------------------------------------------
  function toCanvasX(clientX) {
    const b = canvas.getBoundingClientRect();
    if (!b.width) return aimX;
    return (clientX - b.left) * (W / b.width);
  }

  function clampAim(x) {
    const r = R[curLv];
    return Math.max(LEFT + r + 2, Math.min(RIGHT - r - 2, x));
  }

  function drop() {
    if (mode !== 'play' || dropCool > 0) return;
    addFruit(clampAim(aimX), SPAWN_Y, curLv, 0, 60);
    curLv = nextLv;
    nextLv = (Math.random() * DROPPABLE) | 0;
    dropCool = DROP_WAIT;
    SFX.tone(300, 0.07, 'sine', 0.08, 200);
  }

  canvas.addEventListener('pointermove', (e) => {
    if (mode !== 'play') return;
    aimX = toCanvasX(e.clientX);
  });
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    AdSDK.interaction(e.pointerType === 'touch' ? 'touch' : 'pointer');
    aimX = toCanvasX(e.clientX);
    drop();
  });
  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft')  { aimX -= 26; e.preventDefault(); }
    if (e.key === 'ArrowRight') { aimX += 26; e.preventDefault(); }
    if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      AdSDK.interaction('keyboard');
      drop();
    }
  });

  // ---- 物理 ---------------------------------------------------------------
  function merge(a, b) {
    const lv = a.lv + 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    a.dead = true; b.dead = true;
    score += (a.lv + 1) * 10;

    if (a.lv >= MAXLV) {
      // いちばん大きいもの同士は、消えて大きな得点になる
      popped++;
      score += 200;
      SFX.tone(660, 0.20, 'sine', 0.16);
      SFX.tone(990, 0.26, 'sine', 0.13, null, 0.09);
      SFX.noise(0.32, 2200, 400, 0.10);
      return;
    }
    addFruit(mx, my, lv, (b.x - a.x) * 0.4, -60);
    SFX.tone(300 + lv * 62, 0.13, 'sine', 0.13, 420 + lv * 70);
  }

  function step(dt) {
    for (const f of fruits) {
      f.age += dt;
      f.vy += GRAVITY * dt;
      f.vx *= FRICTION;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }

    for (let it = 0; it < ITER; it++) {
      // 壁と床
      for (const f of fruits) {
        if (f.x - f.r < LEFT)  { f.x = LEFT + f.r;  if (f.vx < 0) f.vx = -f.vx * REST; }
        if (f.x + f.r > RIGHT) { f.x = RIGHT - f.r; if (f.vx > 0) f.vx = -f.vx * REST; }
        if (f.y + f.r > FLOOR) {
          f.y = FLOOR - f.r;
          if (f.vy > 0) f.vy = -f.vy * REST;
          f.vx *= 0.9;
        }
      }
      // くだもの同士
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.dead) continue;
        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.dead) continue;
          let dx = b.x - a.x, dy = b.y - a.y;
          let d = Math.hypot(dx, dy);
          const min = a.r + b.r;
          if (d >= min) continue;
          if (d < 0.0001) { dx = 0; dy = -1; d = 0.0001; }

          if (a.lv === b.lv) { merge(a, b); continue; }

          const nx = dx / d, ny = dy / d;
          const overlap = min - d;
          // 質量は面積で近似する。大きいものほど動かない。
          const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
          a.x -= nx * overlap * (mb / tot);
          a.y -= ny * overlap * (mb / tot);
          b.x += nx * overlap * (ma / tot);
          b.y += ny * overlap * (ma / tot);

          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) {
            const imp = -(1 + REST) * rel / tot;
            a.vx -= imp * nx * mb; a.vy -= imp * ny * mb;
            b.vx += imp * nx * ma; b.vy += imp * ny * ma;
          }
        }
      }
    }

    if (fruits.some((f) => f.dead)) fruits = fruits.filter((f) => !f.dead);
  }

  function checkOver(dt) {
    // 「線を越えている」かつ「ほぼ止まっている」かつ「落ちたばかりではない」
    const bad = fruits.some((f) =>
      f.age > 0.7 && f.y - f.r < DEAD_Y && Math.abs(f.vy) < 34);
    overT = bad ? overT + dt : 0;
    if (overT >= OVER_HOLD) gameOver();
  }

  function gameOver() {
    if (mode !== 'play') return;
    mode = 'over';
    if (score > best) best = score;
    SFX.tone(260, 0.2, 'square', 0.12, 90);
    SFX.noise(0.4, 700, 130, 0.12, 0.05);
    document.body.dataset.state = 'done';
    document.getElementById('after').hidden = false;
    const biggest = fruits.reduce((m, f) => Math.max(m, f.lv), -1);
    AdSDK.complete({
      score: score, best: best,
      biggest: biggest >= 0 ? NAME[biggest] : '-',
      popped: popped,
    });
  }

  function update(dt) {
    if (mode !== 'play') return;
    if (dropCool > 0) dropCool = Math.max(0, dropCool - dt);
    const h = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) step(h);
    checkOver(dt);
  }

  // ---- 描画 ---------------------------------------------------------------
  function drawFruit(x, y, r, lv, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = COL[lv];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    // 内側の明るい面と縁で、ぺたっとしないようにする
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.arc(x - r * 0.28, y - r * 0.3, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = Math.max(2, r * 0.09);
    ctx.beginPath(); ctx.arc(x, y, r - ctx.lineWidth / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.fillStyle = '#161c27';
    ctx.fillRect(0, 0, W, H);

    // 箱
    ctx.fillStyle = '#0e131c';
    ctx.fillRect(LEFT, DEAD_Y - 40, RIGHT - LEFT, FLOOR - DEAD_Y + 40);
    ctx.strokeStyle = '#46586f';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(LEFT, DEAD_Y - 40); ctx.lineTo(LEFT, FLOOR);
    ctx.lineTo(RIGHT, FLOOR); ctx.lineTo(RIGHT, DEAD_Y - 40);
    ctx.stroke();

    // 危険ライン
    const warn = overT > 0;
    ctx.strokeStyle = warn ? 'rgba(240,110,90,' + (0.5 + 0.45 * Math.sin(performance.now() / 90)).toFixed(2) + ')'
                           : 'rgba(240,110,90,0.34)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(LEFT, DEAD_Y); ctx.lineTo(RIGHT, DEAD_Y); ctx.stroke();
    ctx.setLineDash([]);

    for (const f of fruits) drawFruit(f.x, f.y, f.r, f.lv);

    if (mode === 'play') {
      const ax = clampAim(aimX);
      // 落とす位置のガイド
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 9]);
      ctx.beginPath(); ctx.moveTo(ax, SPAWN_Y + R[curLv]); ctx.lineTo(ax, FLOOR); ctx.stroke();
      ctx.setLineDash([]);
      drawFruit(ax, SPAWN_Y, R[curLv], curLv, dropCool > 0 ? 0.3 : 1);
    }

    // 次のくだもの
    ctx.fillStyle = '#8695aa';
    ctx.font = '700 17px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('つぎ', 24, 40);
    drawFruit(78 + R[nextLv], 40, R[nextLv] * 0.62, nextLv);

    // スコア
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = '800 40px system-ui, sans-serif';
    ctx.fillText(String(score), W - 24, 42);

    if (mode === 'over') {
      ctx.fillStyle = 'rgba(13,16,23,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '800 50px system-ui, sans-serif';
      ctx.fillText(score + ' てん', W / 2, H / 2 - 14);
      ctx.font = '600 22px system-ui, sans-serif';
      ctx.fillStyle = '#b9c6d6';
      ctx.fillText('最高 ' + best + ' てん', W / 2, H / 2 + 26);
    }
  }

  // ---- ループ -------------------------------------------------------------
  function frame(now) {
    const dt = Math.min(0.04, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;
    update(dt);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function startGame() {
    reset();
    mode = 'play';
    document.body.dataset.state = 'playing';
    lastT = performance.now();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    AdSDK.start({});
  }

  // ---- 画面まわり ---------------------------------------------------------
  const startScreen = document.getElementById('start');
  const afterBar = document.getElementById('after');
  startScreen.hidden = false;

  document.getElementById('btnPlay').addEventListener('click', () => {
    AdSDK.interaction('start_button');
    SFX.unlock();                 // 音の初期化はここだけ = 必ずユーザー操作の後
    startScreen.hidden = true;
    afterBar.hidden = true;
    startGame();
  });
  document.getElementById('btnReplay').addEventListener('click', () => {
    afterBar.hidden = true;
    startGame();
  });

  reset();
  draw();

  AdSDK.init({ campaign: 'suika', title: 'ゲーム広告：くだものおとし' });
})();
</script>

</body>
</html>
